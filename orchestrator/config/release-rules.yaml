# 阶段发布规则

release:
  mode: stage_atomic
  description: >
    教材单元按阶段分组发布。每个阶段包含3～7个单元，
    经过统一的事实审查、教学审查和阶段一致性检查后，
    通过原子替换从候选目录迁移到正式目录。

stages:
  draft:
    path: "curriculum/units/{unit_id}/draft/"
    description: "Codex编写的初始草稿，尚未通过任何审查"

  release_candidate:
    path: "curriculum/units/{unit_id}/rc/"
    description: "已通过事实审查和教学审查，等待阶段统一检查"

  final:
    path: "curriculum/units/{unit_id}/final/"
    description: "已通过全部审查和阶段一致性检查，正式发布的教材"

stage_consistency_checks:
  - cross_unit_terminology    # 跨单元术语一致性
  - dual_name_mapping         # 双名称映射一致性
  - diagram_text_consistency  # 图文一致性
  - unit_dependency_links     # 单元间依赖链接有效性
  - knowledge_base_conflicts  # 知识库冲突检查
  - typescript_python_parity  # TypeScript/Python 行为契约一致性
  - duplicate_content         # 重复内容检测
  - harness_regression        # Mini Agent Harness 贯穿项目回归
  - original_topic_coverage   # 原核心主题覆盖率

atomic_replacement:
  description: >
    阶段发布使用原子替换：先将所有通过检查的单元
    从 rc/ 复制到 final/，验证所有副本正确写入后，
    再删除 rc/ 中的旧文件。如果任一文件写入失败，
    保留原有 final/ 内容不变，中止本次发布。

  steps:
    1: "验证阶段内所有单元的审查报告均为通过状态"
    2: "执行阶段一致性检查"
    3: "在临时目录构建发布包"
    4: "验证发布包完整性"
    5: "原子替换 final/ 目录"
    6: "更新 redirects.json（如有编号变化）"
    7: "更新知识库"
    8: "清理 rc/ 目录"

unit_numbering:
  immutable: true
  description: >
    已发布单元的编号（M01, M02, ...）原则上不可改变。
    必须在两个已发布单元之间插入新单元时，
    使用 redirects.json 维护重定向映射。

revision:
  description: >
    发现已发布单元的实质性错误时：
    1. 在单元文件中记录修订版本号和修订日期
    2. 在知识库中标记受影响的条目
    3. 检查并传播修正到所有依赖该信息的后续单元
    4. 更新 redirects.json
