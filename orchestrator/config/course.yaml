course:
  name: "Claude Code CLI Source Curriculum"
  unit_min: 30
  unit_max: 45
  main_study_minutes_min: 150
  main_study_minutes_max: 180
  original_core_topics_must_be_preserved: true

learner:
  typescript_level: zero
  java_level: intermediate
  python_level: intermediate
  agent_frameworks:
    - LangChain
    - LangGraph

languages:
  source_language: TypeScript
  clean_room:
    - TypeScript
    - Python
  java_usage:
    - analogy
    - selected_migration_experiments

reviews:
  fact:
    two_stage: true
    same_session: true
    max_complete_attempts: 3
    max_supplement_requests: 1
  teaching:
    normal_rechecks: 1
    severe_rechecks: 2
  json_retries: 2
  output_format: json_only

release:
  mode: stage_atomic
  units_per_stage_min: 3
  units_per_stage_max: 7

uncertainty:
  inline_label: "【推断】"

first_run:
  generate_design_package_only: true
  forbid_unit_body_generation: true
