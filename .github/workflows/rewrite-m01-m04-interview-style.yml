name: Rewrite M01-M04 interview style

on:
  push:
    branches:
      - agent/rewrite-m01-m04-interview-style
    paths:
      - scripts/rewrite_m01_m04_interview_style.py
      - .github/workflows/rewrite-m01-m04-interview-style.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/rewrite-m01-m04-interview-style
          fetch-depth: 0

      - name: Rewrite four course units
        run: python3 scripts/rewrite_m01_m04_interview_style.py

      - name: Validate generated diff
        run: |
          git diff --check
          for file in curriculum/units/M01/final.md curriculum/units/M02/final.md curriculum/units/M03/final.md curriculum/units/M04/final.md; do
            grep -q '<!-- INTERVIEW_LED_STYLE_V1 -->' "$file"
          done

      - name: Commit generated Markdown
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/units/M01/final.md curriculum/units/M02/final.md curriculum/units/M03/final.md curriculum/units/M04/final.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "docs: rewrite M01-M04 in interview-led style"
          git push origin HEAD:agent/rewrite-m01-m04-interview-style
