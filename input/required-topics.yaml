# 核心主题清单 — 必须覆盖的教学主题
# Codex 首次运行时基于此清单核对原课程覆盖情况

required_topics:
  # ---- CLI 入口与启动 ----
  - id: CLI-01
    topic: CLI 入口和配置
    description: 命令行启动、参数解析、配置文件加载

  # ---- 核心查询引擎 ----
  - id: QE-01
    topic: QueryEngine
    description: 查询引擎的初始化、配置与整体架构

  - id: QE-02
    topic: mutableMessages 与 messages
    description: 消息模型、可变消息与最终消息的区别和用途

  - id: QE-03
    topic: query 与 queryLoop
    description: 查询执行、查询循环、消息收发机制

  - id: QE-04
    topic: LLM 调用
    description: API请求构造、响应解析、模型选择、流式处理

  # ---- 上下文管理 ----
  - id: CTX-01
    topic: Context Pipeline
    description: 上下文构建管道、各个Stage、裁剪与组装

  - id: CTX-02
    topic: 上下文压缩
    description: 上下文窗口管理、压缩策略、摘要生成

  # ---- 记忆与持久化 ----
  - id: MEM-01
    topic: 记忆（Memory）
    description: 记忆存储、读取、更新、Memory文件格式

  - id: MEM-02
    topic: Transcript
    description: 会话记录、回放、导出

  - id: MEM-03
    topic: 中断恢复
    description: 会话中断后的状态保存与恢复机制

  # ---- 工具系统 ----
  - id: TOOL-01
    topic: Tools
    description: 工具定义、注册、调用、结果处理

  - id: TOOL-02
    topic: Permissions（权限）
    description: 工具权限模型、沙箱策略、用户确认流程

  # ---- Hooks ----
  - id: HK-01
    topic: Hooks
    description: 生命周期钩子、事件触发、拦截与修改

  # ---- Skills ----
  - id: SK-01
    topic: Skills
    description: Skill 定义、注册、发现机制

  - id: SK-02
    topic: Skill 类型、预执行、占位符
    description: 不同类型的Skill、执行前置条件与占位符机制

  - id: SK-03
    topic: Skill 延迟加载和执行策略
    description: 按需加载、优先级调度、执行生命周期

  # ---- MCP ----
  - id: MCP-01
    topic: MCP（Model Context Protocol）
    description: MCP服务器连接、工具发现、协议交互

  # ---- Plugins ----
  - id: PLG-01
    topic: Plugins
    description: 插件系统架构、加载、生命周期管理

  # ---- 任务系统 ----
  - id: TSK-01
    topic: Work-item Task
    description: 工作项任务模型、创建、分配、追踪

  - id: TSK-02
    topic: Runtime Task 状态机
    description: 任务生命周期状态转换、事件驱动

  - id: TSK-03
    topic: 同步 Subagent
    description: 同步子Agent的创建、通信、结果回收

  - id: TSK-04
    topic: 异步 Subagent
    description: 异步子Agent的启动、消息传递、完成通知

  - id: TSK-05
    topic: Agent Team
    description: 多Agent组队、角色分配、协调机制

  - id: TSK-06
    topic: Mailbox
    description: Agent间消息邮箱系统

  - id: TSK-07
    topic: Team Protocol
    description: 团队通信协议、消息路由、广播与定向

  # ---- 后台任务与调度 ----
  - id: BG-01
    topic: 后台任务
    description: 后台任务启动、监控、取消

  - id: BG-02
    topic: 调度
    description: 任务调度器、优先级、并发控制

  - id: BG-03
    topic: 持久化
    description: 任务持久化、状态恢复

  - id: BG-04
    topic: 幂等
    description: 任务幂等性保证、去重、安全重试

  # ---- 安全与可观测性 ----
  - id: SEC-01
    topic: 沙箱与安全
    description: 沙箱实现、隔离级别、权限边界

  - id: OBS-01
    topic: 可观测性
    description: 日志、指标、追踪、调试工具

  - id: OBS-02
    topic: 评估
    description: Agent行为评估、回归测试、基准测试

  - id: OBS-03
    topic: Token、延迟和成本治理
    description: Token计数、API成本追踪、延迟优化

  # ---- Mini Agent Harness ----
  - id: HAR-01
    topic: Mini Agent Harness
    description: 贯穿项目的整体架构、从零构建、逐步演进
